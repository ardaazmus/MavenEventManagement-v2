<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="940" viewBox="0 0 1450 940"><rect width="1450" height="940" fill="#f8fafc"/><rect x="0" y="0" width="1450" height="70" fill="#0f172a"/><text x="24" y="32" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#ffffff">4 · KAPSAM &amp; KARAR AĞACI — Yetki + Katman (şirket ↔ etkinlik) taraması</text><text x="24" y="55" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cbd5e1">Nerede hangi kapı var, nerede önerili yeni kapı — karar ağacı görünümü</text><rect x="24" y="84" width="14" height="14" rx="3" fill="#0f766e"/><text x="44" y="96" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">✓ Sağlam</text><rect x="104.0" y="84" width="14" height="14" rx="3" fill="#b45309"/><text x="124.0" y="96" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">⚠ Risk/Uyarı</text><rect x="212.0" y="84" width="14" height="14" rx="3" fill="#b91c1c"/><text x="232.0" y="96" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">✗ Kırık nokta</text><rect x="327.0" y="84" width="14" height="14" rx="3" fill="#7c3aed"/><text x="347.0" y="96" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">→ Öneri (dashed)</text><rect x="520" y="110" width="400" height="74" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/><rect x="520" y="110" width="400" height="26" rx="10" fill="#dbeafe"/><rect x="520" y="124" width="400" height="12" fill="#dbeafe"/><text x="720.0" y="128" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">İstek / Görünüm Kararı</text><text x="530" y="154" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">herhangi bir modül açılışı veya API çağrısı</text><rect x="120" y="240" width="420" height="160" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/><rect x="120" y="240" width="420" height="26" rx="10" fill="#fef3c7"/><rect x="120" y="254" width="420" height="12" fill="#fef3c7"/><text x="330.0" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">UI KARARI (tarayıcı)</text><text x="130" y="284" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">1) yetenek var mı? visibleFor(shell:103)</text><text x="130" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">2) rol görür mü? roleCanSee(constants:500)</text><text x="130" y="316" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">   role=null (auth-off) → TÜMÜ (bilinçli demo)</text><text x="130" y="332" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">   ORG_* → her şey · değilse MODULES.roles statik</text><text x="130" y="348" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">3) seçim → MODULE_COMPONENTS(module-components.tsx)</text><rect x="457.2" y="228" width="76.8" height="22" rx="11" fill="#b45309"/><text x="495.59999999999997" y="243" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">⚠ UI-ÖZEL</text><rect x="880" y="240" width="440" height="160" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/><rect x="880" y="240" width="440" height="26" rx="10" fill="#fee2e2"/><rect x="880" y="254" width="440" height="12" fill="#fee2e2"/><text x="1100.0" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">API KARARI (sunucu)</text><text x="890" y="284" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">1) middleware: oturum var mı? (auth-on) ✓</text><text x="890" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">2) resolveContext: KİRACI ✓ (tenant-guard)</text><text x="890" y="316" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">3) ensureInScope: kayıt kiracıda mı ✓ (IDOR)</text><text x="890" y="332" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">4) rol/modül izni: — YOK — (H-04/N-02)</text><text x="890" y="348" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">5) validate/beforeWrite: yalnız bazı varlıklarda</text><rect x="1215.6" y="228" width="98.4" height="22" rx="11" fill="#b91c1c"/><text x="1264.8" y="243" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">✗ KAPI EKSİK</text><rect x="120" y="470" width="420" height="150" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/><rect x="120" y="470" width="420" height="26" rx="10" fill="#fef3c7"/><rect x="120" y="484" width="420" height="12" fill="#fef3c7"/><text x="330.0" y="488" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">ŞİRKET KATMANI (Tenant)</text><text x="130" y="514" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">ayarlar/dil ✓ · tema ✗(H-09) · kullanıcı yönetimi ✗(H-05)</text><text x="130" y="530" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">arşiv+depo+import/export merkezi ✗(H-10)</text><text x="130" y="546" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">kişi arşivi ✓ · CRM gönderim: capability'ye bağlı ✗(H-08)</text><text x="130" y="562" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">tanıtım ✗(H-11) · CustomRole.permissions: yazılır okunmaz (H-06)</text><rect x="470" y="458" width="64" height="22" rx="11" fill="#b45309"/><text x="502.0" y="473" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">KISMİ</text><rect x="880" y="470" width="440" height="150" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/><rect x="880" y="470" width="440" height="26" rx="10" fill="#fef3c7"/><rect x="880" y="484" width="440" height="12" fill="#fef3c7"/><text x="1100.0" y="488" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">ETKİNLİK KATMANI (Edition)</text><text x="890" y="514" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">capability ✓ · 26 modül ✓ · seed tier verisi ✓ ama UI yok</text><text x="890" y="530" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">kişi listesi etkinlik Bağlı DEĞİL (H-07)</text><text x="890" y="546" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">personel↔etkinlik ataması: model YOK (H-06)</text><text x="890" y="562" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">sponsorluk akışı kırık (H-01/02/03)</text><rect x="1250" y="458" width="64" height="22" rx="11" fill="#b45309"/><text x="1282.0" y="473" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">KISMİ</text><rect x="360" y="690" width="720" height="130" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4"/><rect x="360" y="690" width="720" height="26" rx="10" fill="#ede9fe"/><rect x="360" y="704" width="720" height="12" fill="#ede9fe"/><text x="720.0" y="708" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">ÖNERİLEN KARAR KATMANI (tek doğruluk kaynağı)</text><text x="370" y="734" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">resolveAccess(user, moduleId, editionId, action):</text><text x="370" y="750" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">  1) ORG_OWNER/ORG_ADMIN → FULL  ·  2) UserEventAssignment (etkinlik override)</text><text x="370" y="766" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">  3) StaffRole/rol ModulePermission (şirket)  ·  4) fallback MODULES.roles (geriye-uyum)</text><text x="370" y="782" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">UI: effectiveAccess() = API: requireModule() → aynı tablo ModulePermission</text><rect x="1010" y="678" width="64" height="22" rx="11" fill="#7c3aed"/><text x="1042.0" y="693" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">§3.2</text><line x1="640" y1="184" x2="330" y2="240" stroke="#1d4ed8" stroke-width="2.2"/><polygon points="330.0,240.0 338.0,233.5 339.7,243.3" fill="#1d4ed8"/><line x1="740" y1="184" x2="1000" y2="240" stroke="#1d4ed8" stroke-width="2.2"/><polygon points="1000.0,240.0 990.1,243.0 992.3,233.2" fill="#1d4ed8"/><line x1="330" y1="400" x2="330" y2="470" stroke="#b45309" stroke-width="2.2"/><polygon points="330.0,470.0 325.0,461.0 335.0,461.0" fill="#b45309"/><rect x="291.0" y="416.0" width="78.0" height="15" rx="4" fill="#ffffffdd"/><text x="330.0" y="427.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="bold">görünürlük</text><line x1="1100" y1="400" x2="1100" y2="470" stroke="#b91c1c" stroke-width="2.2"/><polygon points="1100.0,470.0 1095.0,461.0 1105.0,461.0" fill="#b91c1c"/><rect x="1082.0" y="416.0" width="36.0" height="15" rx="4" fill="#ffffffdd"/><text x="1100.0" y="427.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="bold">veri</text><line x1="330" y1="620" x2="520" y2="690" stroke="#334155" stroke-width="2.2"/><polygon points="520.0,690.0 509.8,691.6 513.3,682.2" fill="#334155"/><line x1="1100" y1="620" x2="920" y2="690" stroke="#334155" stroke-width="2.2"/><polygon points="920.0,690.0 926.6,682.1 930.2,691.4" fill="#334155"/><line x1="540" y1="320" x2="880" y2="320" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="6,4"/><polygon points="880.0,320.0 871.0,325.0 871.0,315.0" fill="#b91c1c"/><rect x="646.5" y="325.0" width="127.0" height="15" rx="4" fill="#ffffffdd"/><text x="710.0" y="336.0" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="bold">AYNI matris değil</text><rect x="120" y="850" width="700" height="44" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/><text x="130" y="869" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">Tespit: iki karar merkezi birbirinden bağımsız — UI maskesi ile API arasında tutarlılık ZORUNLU</text><text x="130" y="884" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">(matris tek tabloda)</text><rect x="850" y="850" width="470" height="29" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/><text x="860" y="869" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#b45309">Öncelik sırası: flows → generic CRUD → mail/upload → export</text></svg>