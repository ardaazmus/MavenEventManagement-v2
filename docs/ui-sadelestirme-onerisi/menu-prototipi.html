<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maven V2 — Önerilen Menü Prototipi (Ray + Modül Paneli)</title>
<style>
  /* ── Tek renk kaynağı: 3 nötr ton + 1 marka vurgusu (teal), iki temada AYNI hue ── */
  :root{
    --accent:      #14b8a6;             /* marka teal — açık/koyu ortak */
    --accent-ink:  #0f766e;
    --accent-soft: rgba(20,184,166,.14);
    --rail-bg:     #0c1514;             /* iki temada aynı koyu petrol */
    --rail-ink:    #b6c4c2;
    --panel-bg:    #f6f8f8;
    --panel-ink:   #24312f;
    --panel-mut:   #6b7a78;
    --panel-line:  #e3e9e8;
    --content-bg:  #ffffff;
    --content-ink: #1c2726;
    --content-mut: #64716f;
    --card-line:   #e6ebea;
    --warn:        #d97706;
  }
  html[data-theme="dark"]{
    --accent:      #14b8a6;             /* hue DEĞİŞMİYOR — yalnızca zeminler koyulaşır */
    --accent-ink:  #5eead4;
    --accent-soft: rgba(20,184,166,.16);
    --rail-bg:     #0c1514;
    --rail-ink:    #9fb4b1;
    --panel-bg:    #101a19;
    --panel-ink:   #dbe7e5;
    --panel-mut:   #879996;
    --panel-line:  #1e2b29;
    --content-bg:  #151f1e;
    --content-ink: #e5efee;
    --content-mut: #93a5a2;
    --card-line:  #223130;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:14px/1.45 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--content-bg);color:var(--content-ink)}
  button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
  svg{display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* ── Üst bar: tek satır ── */
  .topbar{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--card-line);background:var(--content-bg)}
  .crumb{font-weight:600;font-size:13px;color:var(--content-mut);display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden}
  .crumb b{color:var(--content-ink)}
  .worksel{margin-left:auto;display:flex;align-items:center;gap:8px}
  .worksel select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--card-line);border-radius:8px;background:var(--content-bg);color:var(--content-ink)}
  .iconbtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--content-mut)}
  .iconbtn:hover{background:var(--accent-soft);color:var(--accent-ink)}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700}

  .frame{display:flex;height:calc(100vh - 52px)}

  /* ── 1) Ray: 60px, bağlam değiştirici ── */
  .rail{width:60px;flex:none;background:var(--rail-bg);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
  .rail .logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#06251f;font-weight:800;display:grid;place-items:center;font-size:15px;margin-bottom:6px}
  .rail .sep{width:26px;height:1px;background:#243432;margin:4px 0}
  .railbtn{position:relative;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--rail-ink)}
  .railbtn:hover{background:#172423;color:#e5efee}
  .railbtn.on{background:var(--accent);color:#06251f}
  .railbtn.on::before{content:"";position:absolute;left:-9px;top:11px;width:3px;height:20px;border-radius:2px;background:var(--accent)}
  .railbtn .dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:2px solid var(--rail-bg)}
  .rail .spacer{flex:1}
  .railbtn small{position:absolute;bottom:3px;font-size:8px;letter-spacing:.04em}

  /* ── 2) Modül paneli: 248px ── */
  .panel{width:248px;flex:none;background:var(--panel-bg);border-right:1px solid var(--panel-line);display:flex;flex-direction:column}
  .panel-head{padding:14px 14px 10px;border-bottom:1px solid var(--panel-line)}
  .panel-head .ctx{font-size:10px;font-weight:700;letter-spacing:.09em;color:var(--accent-ink);text-transform:uppercase}
  .panel-head h2{font-size:14px;margin-top:2px}
  .panel-head .sub{font-size:11px;color:var(--panel-mut)}
  .backbtn{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--panel-mut)}
  .backbtn:hover{color:var(--accent-ink)}
  .panel-body{overflow-y:auto;padding:10px 8px 16px}
  .grp{margin:10px 6px 2px;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--panel-mut);text-transform:uppercase}
  .item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;color:var(--panel-ink);font-size:13px;text-align:left;position:relative}
  .item svg{width:16px;height:16px;flex:none;color:var(--panel-mut)}
  .item:hover{background:var(--accent-soft)}
  .item:hover svg{color:var(--accent-ink)}
  .item.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .item.on svg{color:var(--accent-ink)}
  .item.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--accent)}
  .item .cnt{margin-left:auto;font-size:10px;color:var(--panel-mut);border:1px solid var(--panel-line);border-radius:999px;padding:0 6px}

  /* ── 3) İçerik ── */
  .content{flex:1;overflow-y:auto;padding:26px 30px}
  .content h1{font-size:20px;display:flex;align-items:center;gap:10px}
  .content h1::before{content:"";width:4px;height:20px;border-radius:2px;background:var(--accent)}
  .content .desc{color:var(--content-mut);font-size:13px;margin:6px 0 18px}
  .chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{font-size:11px;font-weight:600;border:1px solid var(--card-line);border-radius:999px;padding:4px 10px;color:var(--content-mut)}
  .chip.map{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .card{border:1px solid var(--card-line);border-radius:12px;padding:16px}
  .card .k{font-size:11px;color:var(--content-mut);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .card .v{font-size:22px;font-weight:700;margin-top:6px}
  .card .d{font-size:12px;color:var(--content-mut);margin-top:4px}
  .rules{margin-top:26px;border:1px dashed var(--card-line);border-radius:12px;padding:16px;color:var(--content-mut);font-size:12.5px}
  .rules b{color:var(--content-ink)}
  .rules ul{margin:8px 0 0 18px;display:grid;gap:4px}
</style>
</head>
<body>

<header class="topbar">
  <div class="crumb">Maven Etkinlik Çözümleri <span>›</span> <b id="crumbWork">No-Dig Turkey 2026</b></div>
  <div class="worksel">
    <select id="workSelect" aria-label="Bağlam / iş seçici">
      <option value="work">İş: No-Dig Turkey 2026</option>
      <option value="company">Firma genelinde (iş yok)</option>
    </select>
    <button class="iconbtn" id="themeBtn" title="Tema değiştir (renk hue'su iki temada aynı kalır)">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>
    <button class="iconbtn" title="⌘K Komut Paleti — tek arama yüzeyi">
      <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
    <div class="avatar">EK</div>
  </div>
</header>

<div class="frame">
  <nav class="rail" aria-label="Bağlam rayı" id="rail"></nav>
  <aside class="panel" aria-label="Modül menüsü" id="panel"></aside>
  <main class="content" id="content"></main>
</div>

    ["modules","Modüller","modules","company-settings:modules"],
    ["consent","İletişim İzinleri","consent","company-settings:comms-consent"],
    ["integr","Entegrasyonlar","integr","integrations"],
    ["compl","Uyumluluk","compl","compliance"],
  ]},
};
const RAIL = [
  ["jobs","İşler"],["portfolio","Portföy"],["comms","İletişim"],["reports","Raporlar"],["settings","Ayarlar"],
];

/* ── Durum: tek doğruluk kaynağı {ctx, area|leaf} ── */
const state = { ctx:"work", area:"jobs", leaf:"parts", work:true };

const rail = document.getElementById("rail");
const panel = document.getElementById("panel");
const content = document.getElementById("content");

function renderRail(){
  rail.innerHTML = `
    <div class="logo">M</div><div class="sep"></div>
    ${state.work ? `<button class="railbtn ${state.ctx==="work"?"on":""}" data-rail="work" title="Aktif İş — modül menüsü">${svg("work")}<span class="dot"></span></button>` : ""}
    ${RAIL.map(([id,label])=>`<button class="railbtn ${state.ctx==="company"&&state.area===id?"on":""}" data-rail="${id}" title="${label}">${svg(id)}</button>`).join("")}
    <div class="spacer"></div>
    <button class="railbtn" title="Yardım">${svg("info")}</button>
  `;
  rail.querySelectorAll("[data-rail]").forEach(b=>b.onclick=()=>{
    const v=b.dataset.rail;
    if(v==="work"){ state.ctx="work"; }
    else { state.ctx="company"; state.area=v;
      // firma alanına girince o alanın ilk maddesi seçili olsun
      state.leaf = COMPANY_NAV[v].items[0][0];
    }
    render();
  });
}

function renderPanel(){
  if(state.ctx==="work"){
    const groups = WORK_NAV;
    panel.innerHTML = `
      <div class="panel-head">
        <div class="ctx">İş Modülleri</div>
        <h2>No-Dig Turkey 2026</h2>
        <div class="sub">22 Eyl — 25 Eyl 2026 · İstanbul</div>
        <button class="backbtn" data-back>← İş listesine dön</button>
      </div>
      <div class="panel-body">
        ${groups.map(g=>`
          <div class="grp">${g.g}</div>
          ${g.items.map(it=>`
            <button class="item ${state.leaf===it[0]?"on":""}" data-leaf="${it[0]}">
              ${svg(it[2])}<span>${it[1]}</span>${it[4]?`<span class="cnt">${it[4]}</span>`:""}
            </button>`).join("")}
        `).join("")}
      </div>`;
    panel.querySelector("[data-back]").onclick = ()=>{ state.ctx="company"; state.area="jobs"; state.leaf="all"; render(); };
  } else {
    const a = COMPANY_NAV[state.area];
    panel.innerHTML = `
      <div class="panel-head">
        <div class="ctx">Firma Geneli</div>
        <h2>${a.t}</h2>
      </div>
      <div class="panel-body">
        ${a.items.map(it=>`
          <button class="item ${state.leaf===it[0]?"on":""}" data-leaf="${it[0]}">
            ${svg(it[2])}<span>${it[1]}</span>${it[4]?`<span class="cnt">${it[4]}</span>`:""}
          </button>`).join("")}
      </div>`;
  }
  panel.querySelectorAll("[data-leaf]").forEach(b=>b.onclick=()=>{ state.leaf=b.dataset.leaf; render(); });
}

function findLeaf(){
  if(state.ctx==="work"){
    for(const g of WORK_NAV){ const f=g.items.find(i=>i[0]===state.leaf); if(f) return {grp:g.g,item:f}; }
  }
  const a=COMPANY_NAV[state.area]; const f=a.items.find(i=>i[0]===state.leaf) || a.items[0];
  return {grp:a.t,item:f};
}

function renderContent(){
  const {grp,item}=findLeaf();
  const [mod,sub]=(item[3]||"dashboard").split(":");
  document.getElementById("crumbWork").textContent =
    state.ctx==="work" ? `No-Dig Turkey 2026 › ${item[1]}` : item[1];
  content.innerHTML = `
    <h1>${item[1]}</h1>
    <p class="desc">${grp} bölümü — bu prototipte içerik yerine yalnızca gezinme iskeleti gösterilir.</p>
    <div class="chiprow">
      <span class="chip map">→ module: <b>${mod}</b>${sub?` · subView: <b>${sub}</b>`:""}</span>
      <span class="chip">bağlam: ${state.ctx==="work"?"İŞ":"FİRMA"}</span>
      <span class="chip">aktif madde: tek karşılaştırma (module + subView)</span>
    </div>
    <div class="cards">
      <div class="card"><div class="k">Kayıtlı Katılımcı</div><div class="v">1.284</div><div class="d">+96 bu hafta</div></div>
      <div class="card"><div class="k">Bekleyen Onay</div><div class="v">12</div><div class="d">3'ü 48 saati aştı</div></div>
      <div class="card"><div class="k">Sponsor Gerçekleşme</div><div class="v">%72</div><div class="d">18 / 25 paket</div></div>
      <div class="card"><div class="k">Oda Doluluk</div><div class="v">%64</div><div class="d">attrition eşiği %20</div></div>
    </div>
    <div class="rules">
      <b>Bu prototipin kuralları</b>
      <ul>
        <li><b>Ray = bağlam değiştirici:</b> menü açmaz; yalnızca panelin hangi bağlamı (İş / Firma alanı) göstereceğini seçer.</li>
        <li><b>Panel = tek seviyeli modül listesi:</b> akordeon-içinde-akordeon, sekme ve panel-içi arama yok; arama yalnızca ⌘K.</li>
        <li><b>Tek aktif stili:</b> teal zemin %14 + 2px sol çubuk; dolu teal yalnızca ray ikonunda.</li>
        <li><b>Tema değişince hue değişmez:</b> sağ üstten koyu temaya geçin — vurgu aynı teal kalır, yalnızca zeminler koyulaşır.</li>
        <li><b>Veri güdümlü:</b> her yaprak <code>module + subView</code> taşır; if/else eşleme zinciri gerekmez.</li>
      </ul>
    </div>`;
}

function render(){ renderRail(); renderPanel(); renderContent(); }

document.getElementById("workSelect").onchange = e=>{
  state.work = e.target.value==="work";
  state.ctx = state.work ? "work" : "company";
  if(!state.work){ state.area="jobs"; state.leaf="all"; } else state.leaf="summary";
  render();
};
document.getElementById("themeBtn").onclick = ()=>{
  const html=document.documentElement;
  html.dataset.theme = html.dataset.theme==="dark" ? "light" : "dark";
};
render();
</script>
</body>
</html>
