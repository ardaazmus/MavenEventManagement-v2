<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d9488" />
<title>Çevrimdışı — Maven Portal</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #f0fdfa, #ffffff);
    color: #134e4a;
    text-align: center;
  }
  .icon {
    width: 72px; height: 72px; margin: 0 auto 16px;
    border-radius: 20px;
    background: #0d9488;
    display: grid; place-items: center;
    box-shadow: 0 8px 24px rgb(13 148 136 / 0.3);
  }
  .icon svg { width: 36px; height: 36px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { font-size: 14px; color: #5f6b6b; line-height: 1.5; max-width: 300px; margin: 0 auto; }
  button {
    margin-top: 20px;
    min-height: 48px; padding: 0 28px;
    border: 0; border-radius: 14px;
    background: #0d9488; color: #fff;
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="19.5" r="1" fill="#fff" stroke="none"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
    </div>
    <h1>Bağlantı kesildi</h1>
    <p>İnternet bağlantısı olmadan portal açılamıyor. Bağlantınız geldiğinde tekrar deneyin.</p>
    <button onclick="location.reload()">Tekrar Dene</button>
  </main>
</body>
</html>
