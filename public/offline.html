<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d9488" />
  <title>Çevrimdışı — Maven Portal</title>
  <style>
    /* PWA offline fallback — service worker gezinme istekleri çevrimdışında bu sayfaya düşer.
       Statik: harici kaynak yok, tek dosya; tema teal (portal varsayılanı). */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #f0fdfa 0%, #ffffff 55%, #f0fdfa 100%);
      color: #0f172a; padding: 24px; text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    .card {
      max-width: 340px; width: 100%;
      background: #fff; border: 1px solid #ccfbf1; border-radius: 20px;
      padding: 32px 24px; box-shadow: 0 12px 32px rgba(13, 148, 136, 0.10);
    }
    .icon {
      width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 18px;
      display: grid; place-items: center; background: #f0fdfa; border: 1px solid #99f6e4;
    }
    .icon svg { width: 30px; height: 30px; stroke: #0d9488; }
    h1 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    p { font-size: 13px; line-height: 1.55; color: #64748b; margin-bottom: 20px; }
    button {
      appearance: none; border: 0; cursor: pointer;
      background: #0d9488; color: #fff; font-size: 13px; font-weight: 600;
      padding: 11px 22px; border-radius: 999px; min-height: 44px;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    button:active { transform: scale(0.96); background: #0f766e; }
    .hint { margin-top: 14px; font-size: 11px; color: #94a3b8; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12" /><path d="m7 10 5 5 5-5" /><path d="M5 21h14" />
      </svg>
    </div>
    <h1>Çevrimdışısınız</h1>
    <p>Portal şu anda internet bağlantısına ulaşamıyor. Bağlantınızı kontrol edin ve tekrar deneyin — planınız, hatırlatıcılarınız ve indirdiğiniz dosyalar cihazınızda güvende.</p>
    <button onclick="location.reload()">Tekrar Dene</button>
    <p class="hint">You are offline · Reconnect and try again</p>
  </main>
</body>
</html>
